spring.application.name=transit-app
server.port=8080

# H2 database is enabled by default for easy testing.
spring.datasource.url=jdbc:h2:mem:transitdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# To use MySQL later, comment out the H2 settings above and use this example:
# spring.datasource.url=jdbc:mysql://localhost:3306/transitdb
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.hibernate.ddl-auto=update
